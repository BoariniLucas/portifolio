<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

        <link rel="stylesheet" href="./assets/style.css">

    </head>

    <body>

    <header class="header">
        <div class="header-container">

            <a href="#home" class="logo">
                <img src="assets/img/logo.png" alt="Lucas Boarini Digital Solutions">
            </a>

            <nav class="nav">
                <a href="#home" class="active" data-i18n="nav.home">Início</a>
                <a href="#solutions" data-i18n="nav.solutions">Soluções</a>
                <a href="#projects" data-i18n="nav.projects">Projetos</a>
                <a href="#about" data-i18n="nav.about">Sobre</a>
            </nav>

            <div class="language-selector">

                <button class="language-button" id="language-button">
                    <img
                        id="language-flag"
                        src="assets/img/flags/br.svg"
                        alt="Português"
                    >
                    <span id="language-label">PT</span>
                    <img src="assets/img/icons/arrow-drop-down.svg">
                </button>

                <div class="language-menu" id="language-menu">

                    <button data-lang="pt">
                        <img src="assets/img/flags/br.svg" alt="">
                        <span>Português</span>
                    </button>

                    <button data-lang="en">
                        <img src="assets/img/flags/ie.svg" alt="">
                        <span>English</span>
                    </button>

                </div>

            </div>

            <a href="#contact" class="contact-button" data-i18n="nav.contact">
                Vamos conversar
            </a>

            <button class="menu-toggle" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>

        <main>

            <section id="home">
            <!-- Hero -->
            </section>

            <section id="solutions">
            <!-- Soluções Digitais -->
            </section>

            <section id="projects">
            <!-- Projetos -->
            </section>

            <section id="about">
            <!-- Sobre mim -->
            </section>

            <section id="technologies">
            <!-- Tecnologias -->
            </section>

            <section id="contact">
            <!-- Contato -->
            </section>

        </main>

        <footer>
        </footer>

        <script src="assets/translations.js"></script>
        <script src="assets/script.js"></script>

    </body>
</html>
